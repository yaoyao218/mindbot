<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>心事日記</title>

<!-- Google Fonts：Noto Serif TC（考古卡片襯線體）-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&display=swap" rel="stylesheet">

<!-- LINE LIFF SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        serif: ['"Noto Serif TC"', '"Source Han Serif TC"', 'Georgia', 'serif'],
      },
      colors: {
        glow: {
          main:    '#070b14',
          card:    '#0e1520',
          surface: '#131a26',
          primary: '#6366f1',
          accent:  '#f59e0b',
          text:    '#e2e8f0',
        },
      },
      animation: {
        'pulse-slow':   'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
        'float':        'float 6s ease-in-out infinite',
        'shimmer':      'shimmer 2.5s linear infinite',
        'glow-breathe': 'glowBreathe 4s ease-in-out infinite',
        'fade-in':      'fadeIn .4s ease both',
      },
      keyframes: {
        float: {
          '0%, 100%': { transform: 'translateY(0)' },
          '50%':      { transform: 'translateY(-8px)' },
        },
        shimmer: {
          '0%':   { backgroundPosition: '-200% 0' },
          '100%': { backgroundPosition:  '200% 0' },
        },
        glowBreathe: {
          '0%, 100%': { opacity: '0.4', transform: 'scale(1)' },
          '50%':      { opacity: '0.8', transform: 'scale(1.05)' },
        },
        fadeIn: {
          from: { opacity: '0', transform: 'translateY(8px)' },
          to:   { opacity: '1', transform: 'translateY(0)' },
        },
      },
    },
  },
};
</script>

<style>
/* ── CSS 變數 ───────────────────────────────────────── */
:root {
  --bg-main:    #070b14;
  --bg-card:    #0e1520;
  --bg-surface: #131a26;
  --color-text: #e2e8f0;

  /* 毛玻璃 token */
  --glass-bg:     rgba(14, 21, 32, 0.55);
  --glass-border: rgba(99, 102, 241, 0.15);
  --glass-blur:   blur(20px);
  --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(99,102,241,.08);

  /* Glow token */
  --glow-indigo:  0 0 60px rgba(99, 102, 241, 0.25);
  --glow-amber:   0 0 40px rgba(245, 158, 11, 0.2);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg-main);
  color: var(--color-text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
  /* 深色樹洞基調 — 多層徑向漸層疊加 */
  background-image:
    radial-gradient(ellipse 80% 50% at 20%  0%,  rgba(99, 102, 241, 0.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 90%,  rgba(245,158, 11, 0.05) 0%, transparent 50%),
    radial-gradient(ellipse 50% 60% at 50% 50%,  rgba( 16,185,129, 0.03) 0%, transparent 70%);
}

/* ── 環境氛圍光球（CSS-only）─────────────────────── */
#ambient-orbs {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
}
#ambient-orbs::before {
  content: '';
  position: absolute; top: -10%; left: -5%;
  width: 55vw; height: 55vw; max-width: 480px; max-height: 480px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(99,102,241,.09) 0%, transparent 70%);
  animation: glowBreathe 8s ease-in-out infinite;
}
#ambient-orbs::after {
  content: '';
  position: absolute; bottom: 5%; right: -10%;
  width: 45vw; height: 45vw; max-width: 380px; max-height: 380px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(245,158,11,.07) 0%, transparent 70%);
  animation: glowBreathe 10s ease-in-out infinite reverse;
}
@keyframes glowBreathe {
  0%, 100% { opacity: .5; transform: scale(1); }
  50%       { opacity: 1;  transform: scale(1.08); }
}

/* ── 毛玻璃卡片基礎 ─────────────────────────────── */
.glass-card {
  background:    var(--glass-bg);
  border:        1px solid var(--glass-border);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  box-shadow:    var(--glass-shadow);
  border-radius: 1.25rem;
}
.glass-card-sm {
  background: rgba(19, 26, 38, 0.7);
  border: 1px solid rgba(255,255,255,.06);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 1rem;
}

/* ── 3D 翻牌 ────────────────────────────────────── */
.tarot-card-container { perspective: 1200px; }
.tarot-card-inner {
  transform-style: preserve-3d;
  transition: transform .75s cubic-bezier(.25,.46,.45,.94);
}
.tarot-card-container.flipped .tarot-card-inner { transform: rotateY(180deg); }
.backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.rotate-Y-180   { transform: rotateY(180deg); }

/* 翻牌後光暈 */
.tarot-card-container.flipped .tarot-card-inner {
  filter: drop-shadow(0 0 24px rgba(99,102,241,.4));
}

/* ── Shimmer 動畫（載入骨架 + 卡牌光掃）──────── */
.skeleton {
  background: linear-gradient(
    90deg,
    var(--bg-surface)  25%,
    #1e2d42            50%,
    var(--bg-surface)  75%
  );
  background-size: 200% 100%;
  animation: loading 1.6s ease infinite;
}
@keyframes loading {
  0%   { background-position:  200% 0 }
  100% { background-position: -200% 0 }
}

.shimmer-sweep {
  position: relative; overflow: hidden;
}
.shimmer-sweep::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(
    105deg,
    transparent       30%,
    rgba(255,255,255,.06) 50%,
    transparent       70%
  );
  background-size: 200% 100%;
  animation: shimmer 2.5s linear infinite;
}
@keyframes shimmer {
  0%   { background-position: -200% 0 }
  100% { background-position:  200% 0 }
}

/* ── 頁面進場 ────────────────────────────────── */
@keyframes fadeIn { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:translateY(0) } }
.page-view { animation: fadeIn .38s ease both; padding-bottom: 80px; min-height: 100vh; }

/* ── 底部 Nav ────────────────────────────────── */
#bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(7, 11, 20, 0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid rgba(99, 102, 241, 0.1);
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 50;
  /* 底部微光線 */
  box-shadow: 0 -1px 0 rgba(99,102,241,.08), 0 -20px 40px rgba(7,11,20,.6);
}
#bottom-nav button {
  position: relative;
  transition: color .2s, transform .15s;
}
#bottom-nav button.text-glow-primary::before {
  content: '';
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 24px; height: 2px; border-radius: 2px;
  background: #6366f1;
  box-shadow: 0 0 8px rgba(99,102,241,.8);
}
#bottom-nav button:active { transform: scale(.92); }

/* ── Toast ───────────────────────────────────── */
#toast {
  position: fixed; bottom: 90px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(99, 102, 241, .88);
  backdrop-filter: blur(12px);
  color: #fff; font-size: 13px; padding: 9px 22px; border-radius: 24px;
  opacity: 0; pointer-events: none;
  transition: opacity .3s, transform .3s;
  z-index: 100;
  box-shadow: 0 4px 20px rgba(99,102,241,.35);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Modal 底部抽屜 ──────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, .75);
  backdrop-filter: blur(4px);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 60; animation: fadeIn .22s ease both;
}
.modal-sheet {
  background: var(--bg-card);
  border-radius: 24px 24px 0 0;
  border: 1px solid rgba(99, 102, 241, .12); border-bottom: none;
  width: 100%; max-width: 540px; padding: 24px 20px;
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
  max-height: 85vh; overflow-y: auto;
  box-shadow: 0 -8px 40px rgba(0,0,0,.5);
}

/* ── 月曆塔羅標記 ────────────────────────────── */
.has-tarot { position: relative; }
.has-tarot::after {
  content: '✦'; position: absolute; top: 3px; right: 4px;
  color: #f59e0b; font-size: 9px; font-weight: 700;
  text-shadow: 0 0 6px rgba(245,158,11,.7);
}

/* ── 載入畫面 ────────────────────────────────── */
#loading-screen {
  position: fixed; inset: 0; background: var(--bg-main);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; z-index: 200;
}
.loading-plant {
  font-size: 3.5rem;
  animation: float 3s ease-in-out infinite;
  filter: drop-shadow(0 0 20px rgba(99,102,241,.4));
}
.loading-ring {
  width: 64px; height: 64px; border-radius: 50%;
  border: 2px solid transparent;
  border-top-color: rgba(99,102,241,.6);
  border-right-color: rgba(99,102,241,.2);
  animation: spin 1.2s linear infinite;
  position: absolute;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── 每週內心考古卡片 ────────────────────────── */
.arch-card {
  position: relative; overflow: hidden;
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  border-radius: 1.5rem;
  box-shadow: var(--glass-shadow);
  padding: 24px 20px 20px;
}
.arch-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg,
    transparent,
    rgba(196,165,90,.55) 30%,
    rgba(99,102,241,.4) 70%,
    transparent);
}
.arch-header-label {
  font-size: 10px; letter-spacing: .18em;
  color: rgba(196,165,90,.7); text-transform: uppercase; margin-bottom: 6px;
}
.arch-week-id {
  font-size: 11px; color: #334155; letter-spacing: .1em; margin-bottom: 14px;
}
.arch-summary {
  font-family: 'Noto Serif TC', Georgia, serif;
  font-size: 15px; font-weight: 400; line-height: 1.85;
  color: #cbd5e1; margin-bottom: 20px; letter-spacing: .04em;
}
.arch-themes {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px;
}
.arch-theme-tag {
  font-size: 11px; padding: 4px 12px; border-radius: 14px;
  background: rgba(99,102,241,.1); border: 1px solid rgba(99,102,241,.2);
  color: #818cf8; letter-spacing: .04em;
}
.arch-layers {
  display: flex; flex-direction: column;
  border-radius: .875rem; overflow: hidden;
  border: 1px solid rgba(99,102,241,.1); margin-bottom: 20px;
}
.arch-layer {
  padding: 11px 14px; display: flex; align-items: flex-start; gap: 10px;
  border-bottom: 1px solid rgba(99,102,241,.06);
}
.arch-layer:last-child { border-bottom: none; }
.arch-layer-surface { background: rgba(99,102,241,.07); }
.arch-layer-middle  { background: rgba(99,102,241,.04); }
.arch-layer-deep    { background: rgba(99,102,241,.02); }
.arch-layer-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 5px;
}
.arch-layer-surface .arch-layer-dot { background: rgba(99,102,241,.65); }
.arch-layer-middle  .arch-layer-dot { background: rgba(99,102,241,.4);  }
.arch-layer-deep    .arch-layer-dot { background: rgba(99,102,241,.22); }
.arch-layer-tag {
  font-size: 9px; letter-spacing: .12em; color: rgba(99,102,241,.5);
  flex-shrink: 0; margin-top: 5px; width: 26px;
}
.arch-layer-text {
  font-family: 'Noto Serif TC', Georgia, serif;
  font-size: 12px; line-height: 1.7; color: #94a3b8; flex: 1;
}
.arch-narrative {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px;
}
.arch-arc-cell {
  background: rgba(15,21,35,.5); border: 1px solid rgba(255,255,255,.05);
  border-radius: .75rem; padding: 10px 12px;
}
.arch-arc-label {
  font-size: 9px; letter-spacing: .14em; color: rgba(196,165,90,.6);
  margin-bottom: 5px;
}
.arch-arc-text {
  font-family: 'Noto Serif TC', Georgia, serif;
  font-size: 11px; line-height: 1.65; color: #64748b;
}
.arch-bubble-label {
  font-size: 10px; letter-spacing: .14em; color: #334155;
  margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.arch-bubble-label::after {
  content: ''; flex: 1; height: 1px; background: rgba(255,255,255,.04);
}
.arch-bubble-wrap {
  width: 100%; height: 240px; border-radius: .875rem; overflow: hidden;
  background: rgba(7,11,20,.5); border: 1px solid rgba(255,255,255,.04);
  margin-bottom: 20px;
}
.arch-bubble-wrap canvas { display: block; width: 100%; height: 100%; }
.arch-growth {
  display: flex; align-items: flex-start; gap: 10px;
  background: rgba(16,185,129,.05); border: 1px solid rgba(16,185,129,.1);
  border-radius: .875rem; padding: 12px 14px; margin-bottom: 18px;
}
.arch-growth-text {
  font-family: 'Noto Serif TC', Georgia, serif;
  font-size: 12px; line-height: 1.7;
  color: rgba(52,211,153,.8); font-style: italic;
}
.arch-quote { border-top: 1px solid rgba(255,255,255,.04); padding-top: 16px; }
.arch-quote-text {
  font-family: 'Noto Serif TC', Georgia, serif;
  font-size: 13px; font-weight: 300; line-height: 1.8;
  color: #64748b; font-style: italic;
}
.arch-quote-author {
  text-align: right; font-size: 11px;
  color: rgba(196,165,90,.65); margin-top: 8px; letter-spacing: .06em;
}

/* ── 頂部標題欄 ──────────────────────────────── */
#app-header {
  position: sticky; top: 0; z-index: 40;
  padding-top: max(12px, env(safe-area-inset-top));
  background: rgba(7, 11, 20, 0.9);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,.04);
}
</style>
</head>
<body>

<!-- 環境光球（背景氛圍） -->
<div id="ambient-orbs" aria-hidden="true"></div>

<!-- 載入畫面 -->
<div id="loading-screen">
  <div style="position:relative;display:flex;align-items:center;justify-content:center;width:64px;height:64px;margin-bottom:20px">
    <div class="loading-ring"></div>
    <span class="loading-plant" style="font-size:2rem">🌿</span>
  </div>
  <p style="color:#334155;font-size:13px;letter-spacing:.14em;font-weight:500">心事日記</p>
  <p style="color:#1e293b;font-size:11px;margin-top:6px;letter-spacing:.08em">正在連接內心空間…</p>
</div>

<!-- 主應用 -->
<div id="app-screen" style="display:none;position:relative;z-index:1">

  <!-- 頂部標題欄 -->
  <header id="app-header" class="px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <span style="font-size:18px;filter:drop-shadow(0 0 8px rgba(99,102,241,.5))">🌿</span>
      <span style="font-size:15px;font-weight:600;color:#e2e8f0;letter-spacing:.05em">心事日記</span>
    </div>
    <div class="flex items-center gap-1.5">
      <div class="w-1.5 h-1.5 rounded-full bg-emerald-400/50"
           style="box-shadow:0 0 6px rgba(52,211,153,.6)"></div>
      <span id="sync-label" style="font-size:11px;color:#475569">同步中…</span>
    </div>
  </header>

  <!-- 唯一渲染容器 -->
  <main id="app-runtime" class="page-view"></main>

  <!-- 底部導航 -->
  <nav id="bottom-nav" class="flex items-center justify-around py-2">
    <button data-nav="dashboard"
            class="flex flex-col items-center gap-1 px-5 py-1 text-glow-primary transition">
      <span class="text-xl">📊</span>
      <span class="text-xs font-medium">本週</span>
    </button>
    <button data-nav="calendar"
            class="flex flex-col items-center gap-1 px-5 py-1 text-slate-500 transition">
      <span class="text-xl">🌙</span>
      <span class="text-xs font-medium">月曆</span>
    </button>
    <button data-nav="timeline"
            class="flex flex-col items-center gap-1 px-5 py-1 text-slate-500 transition">
      <span class="text-xl">💬</span>
      <span class="text-xs font-medium">對話</span>
    </button>
    <button data-nav="settings"
            class="flex flex-col items-center gap-1 px-5 py-1 text-slate-500 transition">
      <span class="text-xl">⚙️</span>
      <span class="text-xs font-medium">設定</span>
    </button>
  </nav>

</div>

<div id="toast"></div>

<!--
  每週內心考古卡片 HTML Template
  Dashboard.js 使用方式：
    const tpl  = document.getElementById('tpl-archaeology').content.cloneNode(true);
    const card = tpl.querySelector('.arch-card');
    // 填值後 container.appendChild(card);
    // 再 new PsychBubble(card.querySelector('canvas'), report.triad)
-->
<template id="tpl-archaeology">
  <div class="arch-card mx-4 mb-4">

    <!-- 標題 -->
    <p class="arch-header-label">✦ 每週內心考古</p>
    <p class="arch-week-id" data-bind="week_id"></p>

    <!-- 摘要主文 -->
    <p class="arch-summary" data-bind="summary"></p>

    <!-- 主題標籤 -->
    <div class="arch-themes" data-bind="themes">
      <!-- .arch-theme-tag × n，由 JS 動態生成 -->
    </div>

    <!-- 三層地質 -->
    <div class="arch-layers">
      <div class="arch-layer arch-layer-surface">
        <div class="arch-layer-dot"></div>
        <span class="arch-layer-tag">表</span>
        <p class="arch-layer-text" data-bind="archaeology.surface"></p>
      </div>
      <div class="arch-layer arch-layer-middle">
        <div class="arch-layer-dot"></div>
        <span class="arch-layer-tag">中</span>
        <p class="arch-layer-text" data-bind="archaeology.middle"></p>
      </div>
      <div class="arch-layer arch-layer-deep">
        <div class="arch-layer-dot"></div>
        <span class="arch-layer-tag">深</span>
        <p class="arch-layer-text" data-bind="archaeology.deep"></p>
      </div>
    </div>

    <!-- 起承轉合敘事弧 -->
    <div class="arch-narrative">
      <div class="arch-arc-cell">
        <p class="arch-arc-label">起</p>
        <p class="arch-arc-text" data-bind="narrative_arc.opening"></p>
      </div>
      <div class="arch-arc-cell">
        <p class="arch-arc-label">承</p>
        <p class="arch-arc-text" data-bind="narrative_arc.development"></p>
      </div>
      <div class="arch-arc-cell">
        <p class="arch-arc-label">轉</p>
        <p class="arch-arc-text" data-bind="narrative_arc.turning"></p>
      </div>
      <div class="arch-arc-cell">
        <p class="arch-arc-label">合</p>
        <p class="arch-arc-text" data-bind="narrative_arc.closing"></p>
      </div>
    </div>

    <!-- 三維度心靈氣泡 -->
    <p class="arch-bubble-label">心靈三維度</p>
    <div class="arch-bubble-wrap">
      <canvas></canvas>
    </div>

    <!-- 成長觀察 -->
    <div class="arch-growth" data-show="growth_note">
      <span style="font-size:18px;flex-shrink:0">🌱</span>
      <p class="arch-growth-text" data-bind="growth_note"></p>
    </div>

    <!-- 結語引言 -->
    <div class="arch-quote" data-show="end_quote">
      <p class="arch-quote-text" data-bind="end_quote">
        <span style="color:rgba(196,165,90,.35);font-size:18px">「</span>
        <span data-bind-inner="end_quote"></span>
        <span style="color:rgba(196,165,90,.35);font-size:18px">」</span>
      </p>
      <p class="arch-quote-author">
        ——&nbsp;<span data-bind="quote_author"></span>
      </p>
    </div>

  </div>
</template>

<script type="module" src="/static/src/app.js"></script>
</body>
</html>
